<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Garima 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#2e030c;--wine:#5a0a1f;--cream:#f7ecdc;--gold:#d9ad5f;--rose:#e8a0b0;--ink:#5a0f22;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2e030c}}
:root[data-theme="dark"]{--bg:#2e030c}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--cream);font:500 19px/1.65 'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
body:not(.on){overflow:hidden;height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:repeating-linear-gradient(100deg,rgba(255,255,255,.03) 0 3px,transparent 3px 12px),radial-gradient(ellipse at 25% 15%,#7d1030,transparent 60%),radial-gradient(ellipse at 85% 85%,#6a0c25,transparent 55%),var(--bg);background-size:auto,150% 150%,150% 150%,auto;animation:silk 16s ease-in-out infinite alternate}
@keyframes silk{to{background-position:0 0,100% 100%,0 0,0 0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.script{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400}
.sm{font-size:17px;letter-spacing:.12em;opacity:.85}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 22px;text-align:center;position:relative;overflow:hidden}
h2{font:400 clamp(34px,9vw,52px)/1.15 'Great Vibes',cursive;margin:0 0 26px;color:var(--cream);max-width:560px}
.rv{opacity:0;transform:translateY(34px) scale(.96);transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- gate: envelope ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(ellipse at 50% 40%,#7d1030,#3a0612 70%);transition:opacity 1s,transform 1s;cursor:pointer}
#gate.gone{opacity:0;transform:scale(1.15);pointer-events:none}
#gate h3{font:500 20px 'Cormorant Garamond',serif;letter-spacing:.14em;margin:0}
.env{position:relative;width:min(78vw,300px);aspect-ratio:3/2;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-1.5deg)}}
.env>*{position:absolute}
.eb{inset:0;background:#7a0f29;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card{left:7%;right:7%;top:6%;bottom:6%;background:var(--cream);color:var(--ink);border-radius:4px;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s .55s cubic-bezier(.3,1.4,.5,1);outline:2px dotted var(--gold);outline-offset:-8px}
.card b{font:400 34px/1 'Great Vibes',cursive}
.ef{inset:0;background:linear-gradient(160deg,#9b1535,#6e0d27);clip-path:polygon(0 38%,50% 70%,100% 38%,100% 100%,0 100%);z-index:2;border-radius:0 0 6px 6px}
.flap{left:0;right:0;top:0;height:70%;background:#b01a3e;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s .25s,z-index 0s .55s;z-index:3}
.seal{left:50%;top:68%;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1cf8a,#b98737);z-index:4;display:grid;place-items:center;color:#7a5415;font:400 30px 'Great Vibes',cursive;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .card{transform:translateY(-62%) rotate(-2deg)}
.open .seal{animation:pop .5s forwards}
.open .env{animation:none}
@keyframes pop{to{transform:scale(2.4);opacity:0}}
.tap{border:1px solid var(--gold);color:var(--gold);background:transparent;padding:10px 28px;border-radius:30px;font:600 15px 'Cormorant Garamond',serif;letter-spacing:.2em;animation:glow 2s infinite;pointer-events:none}
@keyframes glow{50%{box-shadow:0 0 22px rgba(217,173,95,.55)}}
.open .tap{opacity:0;transition:.3s}

/* ---------- hero ---------- */
.balloons{position:absolute;inset:0;pointer-events:none}
.b{position:absolute;bottom:-130px;width:46px;height:58px;border-radius:50% 50% 48% 48%;opacity:.9;animation:rise linear infinite}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:70px;background:rgba(247,236,220,.5)}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(18px,-30vh)}50%{transform:translate(-14px,-65vh)}100%{transform:translate(10px,-125vh)}}
#nm{font:400 clamp(70px,22vw,130px)/1 'Great Vibes',cursive;color:var(--gold);margin:6px 0;text-shadow:0 6px 30px rgba(0,0,0,.4)}
#nm span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-6deg)}}
.hero-t{font:400 clamp(38px,11vw,64px)/1.1 'Great Vibes',cursive;margin:0}
.age{font:600 56px/1 'Cormorant Garamond',serif;background:linear-gradient(100deg,#f7ecdc 20%,#d9ad5f 40%,#fff 50%,#d9ad5f 60%,#f7ecdc 80%);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite;margin:6px 0}
@keyframes shine{to{background-position:-250%}}
.twk{display:inline-block;color:var(--gold);animation:tw 1.6s ease-in-out infinite;font-size:22px}
.twk:nth-child(3){animation-delay:.8s}
@keyframes tw{50%{transform:scale(.4) rotate(90deg);opacity:.4}}
.pill{display:inline-block;margin-top:14px;padding:6px 20px;border:1px dashed var(--gold);border-radius:30px;font-size:16px}
.hint{position:absolute;bottom:22px;color:var(--gold);animation:hop 1.4s infinite}
@keyframes hop{50%{transform:translateY(10px)}}
p{margin:0 0 16px;max-width:460px}

/* ---------- vinyl ---------- */
.deck{position:relative;width:240px;height:240px}
.vinyl{width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(#0e0e0e 0 2px,#1d1d1d 2px 4px);box-shadow:0 18px 40px rgba(0,0,0,.55);display:grid;place-items:center;animation:spin 5s linear infinite paused}
.vinyl.play{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl img{width:42%;height:42%;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.arm{position:absolute;right:-22px;top:-10px;width:6px;height:120px;background:linear-gradient(var(--gold),#8a6a2c);border-radius:4px;transform-origin:top;transform:rotate(-24deg);transition:transform .8s}
.deck.play .arm{transform:rotate(10deg)}
.bar{width:230px;height:4px;background:rgba(247,236,220,.2);border-radius:4px;margin:28px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:4px}
#pp{width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);background:rgba(0,0,0,.2);color:var(--cream);font-size:20px;cursor:pointer;margin-bottom:12px}
#pp:hover{transform:scale(1.1)}
#pp:focus-visible,#blow:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.fl{position:absolute;font-size:38px;animation:sway 4s ease-in-out infinite;transform-origin:bottom}
@keyframes sway{50%{transform:rotate(9deg) translateY(-6px)}}

/* ---------- story ---------- */
.oval{width:min(60vw,230px);aspect-ratio:4/5;border-radius:50%;overflow:hidden;outline:3px dotted var(--gold);outline-offset:9px;border:6px solid var(--cream);animation:float 5s ease-in-out infinite;margin-bottom:34px}
.oval img{width:100%;height:100%;object-fit:cover}
@keyframes float{50%{transform:translateY(-10px) rotate(1.5deg)}}
.polas{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.pola{width:104px;background:var(--cream);padding:6px 6px 22px;color:var(--ink);font:400 18px 'Great Vibes',cursive;transition:transform .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.pola:nth-child(1){transform:rotate(-6deg)}.pola:nth-child(2){transform:rotate(3deg) translateY(8px)}.pola:nth-child(3){transform:rotate(-3deg)}
.pola:hover{transform:rotate(0) scale(1.18)!important;z-index:2}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block}

/* ---------- wishes ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:480px;width:100%}
.w{border:1px solid rgba(217,173,95,.45);border-radius:18px;padding:18px 12px;background:rgba(0,0,0,.18);cursor:pointer}
.w .e{font-size:38px;display:block;animation:bob 3s ease-in-out infinite}
.w:nth-child(2) .e{animation-delay:.5s}.w:nth-child(3) .e{animation-delay:1s}.w:nth-child(4) .e{animation-delay:1.5s}
.w b{display:block;font-size:22px;color:var(--gold)}
.w span:last-child{font-size:16px;line-height:1.35;display:block}
.w:active{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

/* ---------- letter ---------- */
.paper{background:var(--cream);color:var(--ink);padding:48px 30px;max-width:430px;width:100%;text-align:left;clip-path:polygon(0 1%,8% 0,17% 1.5%,29% 0,41% 1%,55% 0,68% 1.5%,81% 0,92% 1%,100% 0,99% 20%,100% 38%,99% 60%,100% 80%,99% 100%,90% 99%,78% 100%,64% 98.5%,50% 100%,37% 99%,24% 100%,11% 98.5%,0 100%,1% 78%,0 58%,1% 38%,0 18%)}
.paper h2{color:var(--ink);margin:0 0 14px}
.paper p{max-width:none}
.sig{font:400 36px/1.2 'Great Vibes',cursive;margin-top:20px}
.paper .fl{position:static;display:inline-block}

/* ---------- cake ---------- */
.cake{width:min(70vw,260px);height:auto;animation:float 4s ease-in-out infinite}
.fl2{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
.fl2.off{opacity:0;transform:scale(0)}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.12) rotate(4deg)}}
#blow{margin-top:26px;padding:14px 30px;border-radius:40px;border:0;background:var(--gold);color:#3a0612;font:600 20px 'Cormorant Garamond',serif;cursor:pointer;animation:glow 2s infinite}
#cakeMsg{margin-top:22px;font:400 clamp(30px,8vw,44px)/1.2 'Great Vibes',cursive;color:var(--gold)}
footer{padding:30px 20px 50px;text-align:center;opacity:.75;font-size:16px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="gate">
  <h3 data-k="gateTop"></h3>
  <div class="env"><div class="eb"></div>
    <div class="card"><span class="sm" data-k="cardTop"></span><b data-k="cardMain"></b></div>
    <div class="ef"></div><div class="flap"></div><div class="seal">G</div></div>
  <div class="tap" data-k="gateBtn"></div>
</div>

<main>
<section id="hero">
  <div class="balloons" id="balloons"></div>
  <div class="sm rv" data-k="heroTop"></div>
  <h1 class="hero-t rv" data-k="heroTitle"></h1>
  <div id="nm" class="rv"></div>
  <div class="age rv"><span class="twk">✦</span> <span data-k="age"></span> <span class="twk">✦</span></div>
  <p class="rv" data-k="heroSub"></p>
  <div class="pill rv" id="cd"></div>
  <div class="hint">↓</div>
</section>

<section id="song">
  <h2 class="rv" data-k="songTitle"></h2>
  <div class="deck rv" id="deck"><div class="vinyl" id="vinyl"><img id="vimg" alt=""></div><div class="arm"></div></div>
  <div class="bar"><i id="prog"></i></div>
  <button id="pp" aria-label="Play or pause the song">▶</button>
  <p class="sm" data-k="songCaption"></p>
  <span class="fl" style="left:6%;bottom:12%">🌸</span><span class="fl" style="right:7%;top:14%;animation-delay:1s">🤍</span><span class="fl" style="left:8%;top:20%;animation-delay:2s;font-size:28px">🌷</span>
</section>

<section id="story">
  <h2 class="rv" data-k="storyTitle"></h2>
  <div class="oval rv"><img id="mainImg" alt="A favorite memory"></div>
  <div id="storyText"></div>
  <div class="polas rv" id="polas"></div>
</section>

<section id="wishes">
  <h2 class="rv" data-k="wishesTitle"></h2>
  <div class="grid" id="wgrid"></div>
  <p class="sm rv" style="margin-top:22px">tap a card ♥</p>
</section>

<section id="letter">
  <div class="paper rv"><span class="fl" style="float:right">🌼</span>
    <h2 data-k="letterTitle"></h2><div id="letterText"></div>
    <div class="sig"><span data-k="sign"></span><br><span data-k="from"></span></div></div>
</section>

<section id="finale">
  <h2 class="rv" data-k="cakeTitle"></h2>
  <svg class="cake rv" viewBox="0 0 220 200" aria-hidden="true">
    <ellipse cx="110" cy="190" rx="105" ry="8" fill="#1a0207" opacity=".5"/>
    <rect x="22" y="128" width="176" height="58" rx="10" fill="#e8a0b0"/>
    <path d="M22 142q14 14 29 0t29 0 29 0 29 0 29 0 29 0v-14H22z" fill="#f7ecdc"/>
    <rect x="48" y="84" width="124" height="48" rx="9" fill="#b01a3e"/>
    <path d="M48 98q10 12 20 0t20 0 20 0 20 0 20 0 24 0v-14H48z" fill="#f7ecdc"/>
    <g fill="#d9ad5f"><rect x="78" y="52" width="7" height="32" rx="2"/><rect x="107" y="52" width="7" height="32" rx="2"/><rect x="136" y="52" width="7" height="32" rx="2"/></g>
    <g fill="#ffcf6b"><ellipse class="fl2" cx="81.5" cy="42" rx="5.5" ry="10"/><ellipse class="fl2" cx="110.5" cy="42" rx="5.5" ry="10" style="animation-delay:.15s"/><ellipse class="fl2" cx="139.5" cy="42" rx="5.5" ry="10" style="animation-delay:.3s"/></g>
    <g fill="#e0334f"><circle cx="64" cy="162" r="5"/><circle cx="110" cy="166" r="5"/><circle cx="156" cy="162" r="5"/></g>
  </svg>
  <button id="blow" class="rv" data-k="cakeBtn"></button>
  <div id="cakeMsg" class="rv" data-k="cakeDone" style="display:none"></div>
</section>
</main>
<footer data-k="footer"></footer>

<script>

 storyTitle:"Little things I love about you",
 story:["Some people walk into your life quietly and then rearrange everything for the better. That's you. Your laugh turns ordinary days into small celebrations, and your kindness shows up even when you're not trying.",
        "Turning {age} isn't just a number. It's another year of you becoming more you, and I'm so glad I get to watch."],

 wishes:[{e:"🌷",t:"Soft mornings",d:"Slow coffee, sunshine and zero rush."},{e:"✨",t:"Big dreams",d:"May every goal you whisper come true loudly."},{e:"🍰",t:"Endless sweetness",d:"Cake, laughter and people who adore you."},{e:"🦋",t:"Fearless growth",d:"Go bloom, {name}. You were made for it."}],
 letterTitle:"Dear {name},",
 letter:["Happy Birthday! I hope today feels like a warm hug from the universe: full of cake, messages that make you smile, and moments you'll want to keep.",
         "You have a way of making people feel seen. Thank you for that, for the late chats, the inside jokes and the quiet support when it mattered.",
         "May this year be gentler, braver and a lot more fun. You deserve every good thing coming your way."],

/* ---------- build content ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rnd=(a,b)=>a+Math.random()*(b-a);
const T=s=>String(s).replace(/{name}/g,CONFIG.name).replace(/{age}/g,CONFIG.age);
$$('[data-k]').forEach(e=>e.textContent=T(CONFIG[e.dataset.k]));
document.title='Happy Birthday '+CONFIG.name+' 🎂';
const ph=i=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${['#c2485f','#e0a3a8','#8c1230','#d9ad5f'][i%4]}"/><stop offset="1" stop-color="#4a0716"/></linearGradient></defs><rect width="200" height="240" fill="url(#g)"/><text x="100" y="125" font-size="54" text-anchor="middle">🌸</text><text x="100" y="165" font-size="13" fill="#fff" text-anchor="middle" font-family="sans-serif">your photo here</text></svg>`);
const P=CONFIG.photos;
$('#mainImg').src=P.main||ph(0);$('#vimg').src=P.vinyl||ph(1);
const paras=(el,a)=>a.forEach(t=>{const p=document.createElement('p');p.className='rv';p.textContent=T(t);el.append(p)});
paras($('#storyText'),CONFIG.story);paras($('#letterText'),CONFIG.letter);
CONFIG.polaCaps.forEach((c,i)=>{const d=document.createElement('div');d.className='pola';const im=new Image();im.alt='';im.src=P.polas[i]||ph(i+1);d.append(im,c);$('#polas').append(d)});
CONFIG.wishes.forEach(w=>{const d=document.createElement('div');d.className='w rv';d.innerHTML='<span class="e"></span><b></b><span></span>';const s=d.children;s[0].textContent=w.e;s[1].textContent=T(w.t);s[2].textContent=T(w.d);d.onclick=e=>burst(e.clientX,e.clientY,16,'♥');$('#wgrid').append(d)});
[...CONFIG.name].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=i*.14+'s';$('#nm').append(s)});
for(let i=0;i<7;i++){const b=document.createElement('div');b.className='b';b.style.cssText=`left:${6+i*14}%;background:${['#e8a0b0','#d9ad5f','#f7ecdc','#c2485f'][i%4]};animation-duration:${9+i%4*2.5}s;animation-delay:${i*1.3}s`;$('#balloons').append(b)}

/* ---------- countdown ---------- */
function cd(){const ms=new Date(CONFIG.birthday+'T00:00:00')-new Date(),e=$('#cd');
 if(ms>0){const h=Math.floor(ms/36e5);e.textContent='⏳ '+(h>=24?Math.floor(h/24)+'d ':'')+h%24+'h '+Math.floor(ms%36e5/6e4)+'m to go'}
 else e.textContent=ms>-864e5?'🎉 It\u2019s your day, '+CONFIG.name+'!':'💗 Hope it was magical'}
cd();setInterval(cd,30000);

/* ---------- confetti, petals, sparkles ---------- */
const cv=$('#fx'),cx=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,ps=[];
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
const COL=['#d9ad5f','#f7ecdc','#e8a0b0','#c2485f','#ffd6dc','#fff3c4'];
function burst(x,y,n=60,kind){if(RM)n=Math.min(n,8);for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(3,11);ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.18,r:rnd(0,6),vr:rnd(-.3,.3),c:COL[i%6],w:rnd(5,10),h:rnd(3,6),life:rnd(80,140),k:kind||(Math.random()<.25?'♥':'r')})}}
const petal=()=>ps.push({x:rnd(0,W),y:-20,vx:rnd(-.4,.6),vy:rnd(.6,1.4),g:0,r:rnd(0,6),vr:rnd(-.03,.03),c:Math.random()<.5?'#e8a0b0':'#f7ecdc',w:12,h:7,life:900,k:'p',sw:rnd(0,6)});
const spark=(x,y)=>ps.push({x,y,vx:rnd(-1,1),vy:rnd(-1.5,.2),g:.03,r:0,vr:0,c:'#ffe7a8',w:rnd(8,14),h:0,life:40,k:'s'});
(function loop(){cx.clearRect(0,0,W,H);ps=ps.filter(p=>p.life-->0&&p.y<H+30);
 for(const p of ps){p.vy+=p.g;p.x+=p.vx+(p.k=='p'?Math.sin(p.life/20+p.sw)*.8:0);p.y+=p.vy;if(p.k!='p')p.vx*=.985;p.r+=p.vr;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);
  if(p.k=='♥'||p.k=='s'){cx.font=p.w+'px serif';cx.textAlign='center';cx.fillText(p.k=='s'?'✦':'♥',0,0)}
  else if(p.k=='p'){cx.beginPath();cx.ellipse(0,0,p.w,p.h,0,0,6.28);cx.fill()}
  else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
 requestAnimationFrame(loop)})();
if(!RM){setInterval(petal,700);addEventListener('pointermove',e=>{if(Math.random()<.35)spark(e.clientX,e.clientY)})}
addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,10,'♥'));

/* ---------- open the envelope ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.2});
$('#gate').onclick=()=>{const g=$('#gate');if(g.classList.contains('open'))return;g.classList.add('open');
 setTimeout(()=>burst(innerWidth/2,innerHeight/2,130),1000);
 setTimeout(()=>{g.classList.add('gone');document.body.classList.add('on');$$('.rv').forEach(e=>io.observe(e));
  [0,350,700,1100].forEach(d=>setTimeout(()=>burst(rnd(W*.15,W*.85),rnd(H*.15,H*.45),80),d))},2400)};

/* ---------- song: built-in music-box "Happy Birthday" or your own audio ---------- */
const M=[392,.75,392,.25,440,1,392,1,523,1,494,2, 392,.75,392,.25,440,1,392,1,587,1,523,2, 392,.75,392,.25,784,1,659,1,523,1,494,1,440,1, 698,.75,698,.25,659,1,523,1,587,1,523,2];
let ctx,aud,end=0,playing=false;
function synth(){ctx=new(window.AudioContext||window.webkitAudioContext)();let t=ctx.currentTime+.1;
 for(let i=0;i<M.length;i+=2){const d=M[i+1]*.5;[1,2].forEach((m,j)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=j?'sine':'triangle';o.frequency.value=M[i]*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(j?.04:.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d*.95);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d)});t+=d}end=t}
function ui(){$('#vinyl').classList.toggle('play',playing);$('#deck').classList.toggle('play',playing);$('#pp').textContent=playing?'❚❚':'▶'}
function stop(){playing=false;if(ctx){ctx.close();ctx=null}if(aud)aud.currentTime=0;ui()}
$('#pp').onclick=async()=>{
 if(CONFIG.audio){aud=aud||Object.assign(new Audio(CONFIG.audio),{onended:stop});aud.paused?aud.play():aud.pause();playing=!aud.paused}
 else if(!ctx){synth();playing=true}
